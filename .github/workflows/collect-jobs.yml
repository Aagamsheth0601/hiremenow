name: Refresh YC job catalogue
on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yc-catalogue-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install .
      - name: Collect public jobs for India and US
        env:
          DATABASE_URL: ${{ secrets.COLLECTOR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "COLLECTOR_DATABASE_URL is missing; refusing to use a temporary local database."
            exit 1
          fi
          python -m backend.collect
